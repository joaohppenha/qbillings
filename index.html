<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-Billings // Monitoramento Orbital e Roteamento Quântico — SBC</title>
  <meta name="description" content="Pipeline híbrido de sensoriamento remoto (Sentinel-2 + U-Net + NDWI), grafo viário real (OSMnx/NetworkX) e otimização quântica (QUBO/QAOA) na Represa Billings em São Bernardo do Campo." />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f6f7f5;
      --surface: #ffffff;
      --surface-alt: #eef1ed;
      --ink: #111312;
      --ink-muted: #4b524e;
      --border: #111312;
      --border-soft: #cfd5d0;
      --accent: #00a86b;
      --accent-soft: #d9f5e8;
      --alert: #d94e1f;
      --mono: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: var(--bg);
      border-bottom: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border: 1px solid var(--border);
      display: inline-block;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .nav-links a {
      color: var(--ink);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    .nav-links a:hover {
      border-bottom-color: var(--border);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      border-left: 1.5px solid var(--border);
      border-right: 1.5px solid var(--border);
      background: var(--surface);
    }

    .hero {
      padding: 3.5rem 2.5rem 3rem;
      border-bottom: 1.5px solid var(--border);
      background-image:
        linear-gradient(to right, rgba(17, 19, 18, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 19, 18, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: inline-block;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 4.2vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      font-weight: 800;
      max-width: 900px;
      margin-bottom: 1.25rem;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: var(--ink-muted);
      max-width: 780px;
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .btn {
      font-family: var(--mono);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.75rem 1.2rem;
      border: 1.5px solid var(--border);
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 3px 3px 0 var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #08140e;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      border-top: 1.5px solid var(--border);
      border-left: 1.5px solid var(--border);
    }

    .kpi-card {
      padding: 1.25rem;
      border-right: 1.5px solid var(--border);
      border-bottom: 1.5px solid var(--border);
      background: var(--surface);
    }

    .kpi-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.35rem;
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .kpi-note {
      font-size: 0.82rem;
      color: var(--ink-muted);
      margin-top: 0.35rem;
    }

    section {
      padding: 3rem 2.5rem;
      border-bottom: 1.5px solid var(--border);
    }

    .sec-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-soft);
    }

    .sec-tag {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--ink);
      padding: 0.2rem 0.55rem;
    }

    h2 {
      font-size: 1.65rem;
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .box {
      border: 1.5px solid var(--border);
      padding: 1.5rem;
      background: var(--surface);
    }

    .box-alt {
      background: var(--surface-alt);
    }

    .box h3 {
      font-size: 1.1rem;
      margin-bottom: 0.65rem;
      font-weight: 700;
    }

    .box p, .box li {
      font-size: 0.94rem;
      color: var(--ink-muted);
    }

    .box ul {
      padding-left: 1.15rem;
      margin-top: 0.5rem;
    }

    .box li {
      margin-bottom: 0.4rem;
    }

    code {
      font-family: var(--mono);
      font-size: 0.84em;
      background: var(--surface-alt);
      padding: 0.12rem 0.35rem;
      border: 1px solid var(--border-soft);
      color: var(--ink);
    }

    /* Mapa Interativo Leaflet */
    .map-frame {
      border: 1.5px solid var(--border);
      background: var(--surface-alt);
    }

    .map-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      border-bottom: 1.5px solid var(--border);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .map-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .map-btn {
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
    }

    .map-btn.active {
      background: var(--ink);
      color: var(--accent);
    }

    #billings-map {
      width: 100%;
      height: 430px;
      z-index: 1;
    }

    .map-caption {
      padding: 0.75rem 1.1rem;
      border-top: 1px solid var(--border-soft);
      font-size: 0.84rem;
      color: var(--ink-muted);
      background: var(--surface);
    }

    .phase-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap:
